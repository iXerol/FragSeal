name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  BAZEL_CI_ARGS: --config=ci

jobs:
  macos-tests:
    name: macOS tests (${{ matrix.runtime }}, openssl-${{ matrix.openssl_mode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            runtime: native
            openssl_mode: auto
          - runner: xcode-27
            runtime: native
            openssl_mode: disabled
          - runner: xcode-27
            runtime: backdeploy
            openssl_mode: auto
          - runner: xcode-27
            runtime: backdeploy
            openssl_mode: disabled
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}
          repository-cache: true

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Run tests
        run: |
          EXTRA_BAZEL_ARGS=""
          if [ "${{ matrix.openssl_mode }}" = "disabled" ]; then
            EXTRA_BAZEL_ARGS="--repo_env=FRAGSEAL_FORCE_NO_OPENSSL=1"
          fi
          OPENSSL_LIB="$(brew --prefix openssl@3)/lib/libcrypto.3.dylib"
          make test \
            RUNTIME=${{ matrix.runtime }} \
            OPENSSL_LIB="$OPENSSL_LIB" \
            BAZEL_ARGS="${BAZEL_CI_ARGS} --config=macos ${EXTRA_BAZEL_ARGS}"

  macos-builds:
    name: macOS build (${{ matrix.name }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-backdeploy
            make_args: PRODUCT=cli PLATFORM=macos RUNTIME=backdeploy
          - name: cli-native
            make_args: PRODUCT=cli PLATFORM=macos RUNTIME=native
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}
          repository-cache: true

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Build
        run: |
          OPENSSL_LIB="$(brew --prefix openssl@3)/lib/libcrypto.3.dylib"
          make build \
            ${{ matrix.make_args }} \
            OPENSSL_LIB="$OPENSSL_LIB" \
            BAZEL_ARGS="${BAZEL_CI_ARGS} --config=macos"

  linux-tests:
    name: Linux tests (${{ matrix.name }}, openssl-${{ matrix.openssl_mode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
            openssl_mode: auto
          - name: x86_64
            runner: ubuntu-latest
            openssl_mode: disabled
          - name: arm64
            runner: ubuntu-24.04-arm
            openssl_mode: auto
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: docker compose run --rm --entrypoint /bin/bash swift-linux -lc 'clang --version && swift --version'

      - name: Run tests
        run: |
          EXTRA_BAZEL_ARGS=""
          if [ "${{ matrix.openssl_mode }}" = "disabled" ]; then
            EXTRA_BAZEL_ARGS="--repo_env=FRAGSEAL_FORCE_NO_OPENSSL=1"
          fi
          docker compose run --rm \
            --entrypoint /bin/bash \
            swift-linux \
            -lc "make test PLATFORM=linux BAZEL_ARGS='${BAZEL_CI_ARGS} ${EXTRA_BAZEL_ARGS}'"

  linux-builds:
    name: Linux build (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            arch: x86_64
            runner: ubuntu-latest
            make_args: PRODUCT=cli PLATFORM=linux
          - name: cli
            arch: arm64
            runner: ubuntu-24.04-arm
            make_args: PRODUCT=cli PLATFORM=linux
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: docker compose run --rm --entrypoint /bin/bash swift-linux -lc 'clang --version && swift --version'

      - name: Build
        run: |
          docker compose run --rm \
            --entrypoint /bin/bash \
            swift-linux \
            -lc "make build ${{ matrix.make_args }} BAZEL_ARGS='${BAZEL_CI_ARGS}'"
